<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <!-- Google Font (Poppins) for modern, clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Card Container -->
    <div class="todo-card">
        <!-- Top Date Header (from Job 1) -->
        <div class="date-header">
            <span id="currentDate">Loading date...</span>
        </div>

        <!-- Card Content Area -->
        <div class="card-content">
            <h1 class="card-title">To do List</h1>

            <!-- Job 2: Task list container for items -->
            <ul id="taskList" class="task-list">
                <!-- User added tasks will be inserted here dynamically -->
            </ul>

            <!-- Job 2: Input field to add new tasks -->
            <div class="add-task-container">
                <input 
                    type="text" 
                    id="newTaskInput" 
                    class="task-input" 
                    placeholder="add task ..." 
                    autocomplete="off"
                />
                <button id="addTaskBtn" class="add-btn" type="button">Add</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
