<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <!-- Google Font (Poppins) for modern, clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Card Container (inspired by the reference image) -->
    <div class="todo-card">
        <!-- Top Date Header -->
        <div class="date-header">
            <span id="currentDate">Loading date...</span>
        </div>

        <!-- Card Content Area -->
        <div class="card-content">
            <h1 class="card-title">To do List</h1>

            <!-- Tasks container (placeholder ready for Job 2) -->
            <div id="todoListContainer" class="todo-list-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
