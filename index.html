<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <!-- Google Font (Poppins) for modern, clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container that holds all Todo List cards -->
    <div id="listsContainer" class="lists-container">
        <!-- Todo list cards will be added here -->
    </div>

    <!-- Empty state message (shown if all lists are deleted) -->
    <p id="emptyState" class="empty-state" style="display: none;">
        No lists yet. Click the <strong>+</strong> button below to create one!
    </p>

    <!-- Floating "+" button to create a new Todo List (inspired by reference image) -->
    <button id="addListBtn" class="floating-add-list-btn" type="button" title="Add new Todo List">+</button>

    <script src="script.js"></script>
</body>
</html>
